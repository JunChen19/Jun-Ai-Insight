name: Build and deploy site

# Build and publish the site only. Fetching, LLM enrichment and data
# publishing happen on the author's machine (scripts/daily.ps1), because the
# sources and the LLM gateway need the corporate network ¡ª so this workflow
# must not run the pipeline or overwrite the pushed data.
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

# Needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs publish at once; the second would clobber the first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Data files are committed by the local daily run; this guard only
      # covers a hand-made push that forgot them.
      - name: Ensure data files exist
        run: node scripts/ensure-live.mjs

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
